<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sign-off Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&family=Bowlby+One&display=swap">
<style>
/* Layout: wall game board. Header (date, clock, tools). Arena: two player cards either side of a weekly duel panel. Below, four quest columns (daily to yearly). Ticking opens a "who did this" sheet, then a reward card with confetti. Written for old Safari: no flex gap, no optional chaining, ES5 script. */
:root{
  --bg:#E6EAE7;
  --panel:#F4F6F4;
  --card:#FFFFFF;
  --fg:#18211D;
  --muted:#56635C;
  --line:#C5CEC8;
  --track:#D3DAD5;
  --btn:#18211D;
  --btn-fg:#F4F6F4;
  --danger:#B3261E;
  --danger-fg:#FFFFFF;
  --on-person:#FFFFFF;
  --gold:#F2B01E;
  --gold-ink:#3A2A00;
  --scrim:rgba(12,18,15,.62);
  --shadow:0 10px 30px rgba(10,20,15,.28);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --game:"Bowlby One","Arial Black",Impact,sans-serif;
  --text:"Barlow","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101412; --panel:#181E1B; --card:#212824; --fg:#E7EEE9; --muted:#9AA79F; --line:#2F3934; --track:#2B3530;
    --btn:#E7EEE9; --btn-fg:#101412; --danger:#FF8A80; --danger-fg:#2B0A07; --shadow:0 10px 30px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101412; --panel:#181E1B; --card:#212824; --fg:#E7EEE9; --muted:#9AA79F; --line:#2F3934; --track:#2B3530;
  --btn:#E7EEE9; --btn-fg:#101412; --danger:#FF8A80; --danger-fg:#2B0A07; --shadow:0 10px 30px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{touch-action:manipulation}
body{
  background:var(--bg);color:var(--fg);
  font:16px/1.35 var(--text);
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  padding-top:12px;padding-bottom:28px;
  padding-left:16px;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:16px;padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input{font-family:var(--text)}
button:focus,input:focus{outline:3px solid var(--fg);outline-offset:2px}
.ic{display:inline-block;vertical-align:middle;line-height:0}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:0 -6px}
.top>*{margin:4px 6px}
.when{display:flex;align-items:baseline;flex-wrap:wrap}
.date{font:600 22px/1.1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:16px}
.clock{font:700 44px/1 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap}
.tools .btn{margin:2px 0 2px 8px}
.edithint{margin:8px 0 0;display:flex;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:15px}
.edithint .btn{margin-left:12px;min-height:40px;padding:6px 14px;font-size:15px}
.banner{background:var(--danger);color:var(--danger-fg);border-radius:8px;padding:10px 14px;margin:6px 0;font-weight:600}

/* buttons */
.btn{font:600 17px var(--text);min-height:46px;padding:10px 18px;border-radius:8px;border:2px solid var(--btn);background:var(--btn);color:var(--btn-fg);cursor:pointer;-webkit-appearance:none;appearance:none}
.btn.ghost{background:transparent;color:var(--fg)}
.btn.small{min-height:40px;padding:6px 14px;font-size:15px}
.btn.armed,.redeem.armed{background:var(--danger);border-color:var(--danger);color:var(--danger-fg)}
.btn[disabled],.redeem[disabled]{opacity:.35;cursor:default}

/* arena */
.arena{display:flex;flex-wrap:wrap;margin:6px -6px 0;align-items:stretch}
.arena>*{margin:6px;min-width:0}
.pcard{flex:1 1 280px;color:var(--on-person);border-radius:14px;padding:14px 16px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.pcard.p0{order:1}
.duel{order:2;flex:1.15 1 300px}
.pcard.p1{order:3}
.pc-top{display:flex;align-items:center;justify-content:space-between}
.pc-name{font:400 28px/1.1 var(--game);letter-spacing:.01em;min-width:0;overflow-wrap:break-word}
.pc-name .ic{margin-left:8px;margin-top:-4px;color:var(--gold)}
.pc-title{font:600 17px var(--display);letter-spacing:.1em;text-transform:uppercase;opacity:.92;margin:2px 0 10px}
.lvl{flex:0 0 auto;text-align:center;background:rgba(255,255,255,.22);border-radius:12px;padding:6px 12px 4px;min-width:70px;margin-left:10px}
.lvl small{display:block;font:600 11px var(--text);letter-spacing:.16em}
.lvl b{font:400 34px/1.05 var(--game)}
.xpbar{height:14px;border-radius:7px;background:rgba(0,0,0,.25);overflow:hidden}
.xpfill{height:100%;width:0;background:#FFFFFF;border-radius:7px;transition:width .5s}
.xptext{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.pills{display:flex;flex-wrap:wrap;margin:0 -4px}
.pill{display:inline-flex;align-items:center;background:rgba(255,255,255,.22);border-radius:999px;padding:5px 12px 5px 8px;margin:0 4px 4px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.pill .ic{margin-right:6px}
.duel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font:600 15px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.duelnums{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 6px}
.duelnums span{font:400 22px var(--game);font-variant-numeric:tabular-nums}
.duelnums small{font:600 14px var(--text);margin:0 6px;color:var(--muted)}
.duelbar{display:flex;height:18px;border-radius:9px;overflow:hidden;background:var(--track)}
.duelbar.idle{opacity:.45}
.duelbar span{display:block;height:100%;transition:width .5s}
.duelnote{margin:8px 0 6px;font-weight:600}
.duelfoot{display:flex;flex-wrap:wrap;color:var(--muted);font-size:14px;margin:0 -8px}
.duelfoot span{margin:2px 8px;display:inline-flex;align-items:center}
.duelfoot .ic{margin-right:5px}
.flame{color:#E8590C}

/* board */
.board{display:flex;flex-wrap:wrap;margin:8px -6px 0}
.col{flex:0 0 100%;max-width:100%;min-width:0;padding:6px}
@media (min-width:600px){.col{flex:0 0 50%;max-width:50%}}
@media (min-width:1000px){.col{flex:1 1 0;max-width:none}}
@media (max-width:999px){.duel{order:4;flex:1 1 100%}.pcard{flex:1 1 40%}}
.colin{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 12px 8px}
.colhead{display:flex;align-items:baseline;justify-content:space-between}
.colhead h2{margin:0;font:400 24px/1 var(--game);letter-spacing:.03em;text-transform:uppercase}
.count{font:700 22px var(--display);font-variant-numeric:tabular-nums}
.reset{margin:5px 0 0;font-size:13px;color:var(--muted)}
.quest{margin:2px 0 8px;font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center}
.quest .ic{margin-right:5px}
.quest.won{color:var(--fg)}
.track{height:8px;border-radius:4px;background:var(--track);margin-bottom:12px;overflow:hidden}
.fill{height:100%;width:0;background:var(--fg);transition:width .3s}
.empty{color:var(--muted);margin:8px 0 12px;font-size:15px}

.task{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 8px;min-height:60px;cursor:pointer;-webkit-appearance:none;appearance:none}
.task .row1{display:flex;align-items:center}
.box{flex:0 0 28px;width:28px;height:28px;border:2px solid var(--muted);border-radius:6px;margin-right:12px;display:flex;align-items:center;justify-content:center}
.tt{flex:1 1 auto;font-size:19px;font-weight:600;line-height:1.2;min-width:0;overflow-wrap:break-word}
.xpchip{flex:0 0 auto;margin-left:10px;background:var(--gold);color:var(--gold-ink);border-radius:999px;font:700 14px var(--text);padding:2px 10px;white-space:nowrap}
.task.done{color:var(--on-person);border-color:transparent}
.task.done .box{background:var(--on-person);border-color:var(--on-person)}
.task.done .xpchip{background:rgba(255,255,255,.28);color:var(--on-person)}
.box i{display:block;width:7px;height:14px;border-style:solid;border-width:0 3px 3px 0;transform:rotate(45deg);margin-top:-3px}
.who{display:block;margin:6px 0 0 40px;font-size:15px;font-weight:600}

.editrow{display:flex;align-items:center;margin:0 0 8px}
.field{flex:1 1 auto;min-width:0;font-size:17px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.field.cost{flex:0 0 96px;margin-left:8px;text-align:right}
.editrow .btn,.addrow .btn{margin-left:8px;padding:10px 14px;flex:0 0 auto}
.addrow{display:flex;align-items:center;margin:8px 0 6px}

/* modal */
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:var(--scrim);overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;padding:16px}
.sheet{width:100%;max-width:520px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.sheet.wide{max-width:720px}
.sheettitle{margin:2px 0 14px;font:400 28px/1.1 var(--game)}
.step{font-weight:600;margin:0 0 10px}
.worth{display:inline-block;background:var(--gold);color:var(--gold-ink);border-radius:999px;font:700 14px var(--text);padding:2px 12px;margin:0 0 14px}
.whobtns{display:flex;margin:0 -6px}
.whobtn{flex:1 1 0;min-width:0;margin:0 6px;min-height:104px;border:0;border-radius:12px;color:var(--on-person);font:400 30px var(--game);cursor:pointer;-webkit-appearance:none;appearance:none;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.whobtn small{display:block;font:700 13px var(--text);letter-spacing:.06em;margin-top:6px;text-transform:uppercase}
.actions{display:flex;align-items:center;justify-content:flex-end;margin-top:16px}
.actions .btn+.btn{margin-left:10px}
.band{border-radius:10px;color:var(--on-person);padding:12px 14px;margin:2px 0 4px}
.bandname{font:400 28px/1.1 var(--game)}
.bandwhen{font-size:15px}
.loglist{margin:10px 0 0}
.logitem{background:var(--card);border:1px solid var(--line);border-left-width:8px;border-radius:8px;padding:10px 12px;margin:0 0 8px}
.logitem.void{opacity:.5}
.logitem b{font-weight:700}
.logwhen{font-size:13px;color:var(--muted)}
.balances{display:flex;flex-wrap:wrap;margin:0 -4px 12px}
.balances .pill{color:var(--on-person);font-size:18px;margin:0 4px 4px}
.rrow{display:flex;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 8px}
.rname{flex:1 1 200px;min-width:0;font-size:19px;font-weight:600;margin-right:10px}
.rcost{display:inline-flex;align-items:center;font:700 18px var(--text);font-variant-numeric:tabular-nums;margin-right:12px}
.rcost .ic{margin-right:6px}
.rbtns{display:flex}
.redeem{border:0;border-radius:8px;color:var(--on-person);font:700 16px var(--text);min-height:46px;padding:8px 16px;margin-left:8px;cursor:pointer;-webkit-appearance:none;appearance:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.sect{font:600 15px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.collect{border-left-width:8px}
.badgegrid{display:flex;flex-wrap:wrap;margin:0 -5px}
.btile{flex:0 0 50%;max-width:50%;padding:5px;display:flex}
@media (min-width:600px){.btile{flex:0 0 33.333%;max-width:33.333%}}
.btile-in{flex:1 1 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.bicon{width:58px;height:58px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;background:var(--track);color:var(--muted)}
.btile.on .bicon{background:var(--gold);color:var(--gold-ink);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--gold)}
.bname{font:700 16px var(--text)}
.bdesc{font-size:13px;color:var(--muted);margin:2px 0 8px}
.dots{display:flex;justify-content:center}
.dot{width:26px;height:26px;border-radius:50%;margin:0 3px;font:700 13px/22px var(--text);color:var(--on-person);text-align:center;border:2px solid transparent}
.dot.off{background:transparent!important;color:var(--muted);border-color:var(--line)}

/* celebration */
.cele{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none}
.celecard{pointer-events:auto;width:100%;max-width:440px;background:var(--panel);color:var(--fg);border:3px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{transform:scale(.55);opacity:0}100%{transform:scale(1);opacity:1}}
.celeband{color:var(--on-person);padding:10px 16px;display:flex;align-items:baseline;justify-content:space-between}
.celewho{font:400 24px/1.1 var(--game)}
.celekick{font-size:15px;font-weight:600;margin-left:12px;text-align:right;min-width:0;overflow-wrap:break-word}
.celebody{padding:14px 16px 18px;text-align:center}
.celebig{font:400 60px/1.05 var(--game)}
.celesub{font-weight:600;color:var(--muted);margin-top:2px}
.celechips{display:flex;flex-wrap:wrap;justify-content:center;margin:12px -3px 0}
.celechip{background:var(--gold);color:var(--gold-ink);font:700 15px var(--text);border-radius:999px;padding:4px 14px;margin:3px}
.celelevel{background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.celelvl1{font:400 15px var(--game);letter-spacing:.2em;color:var(--gold)}
.celelvl2{font:400 40px/1.1 var(--game)}
.celelvl3{font:600 18px var(--display);letter-spacing:.1em;text-transform:uppercase}
.celebadge{display:flex;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:10px 0 0}
.celebadge .bicon{margin:0 12px 0 0;flex:0 0 auto;width:48px;height:48px;background:var(--gold);color:var(--gold-ink)}
.celebadge b{display:block;font-size:17px}
.celebadge span{font-size:13px;color:var(--muted)}
#fx{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:90}
.stakes{margin:10px 0 4px}
.stakerow{padding:6px 0;border-top:1px solid var(--line)}
.sk-top{display:flex;justify-content:space-between;align-items:baseline}
.sk-label{font:600 15px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sk-lead{font:700 16px var(--text)}
.sk-prize{font-size:14px;color:var(--muted);overflow-wrap:break-word}
.owed{margin-top:8px}
.owedrow{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-left-width:10px;border-radius:10px;padding:10px 12px;margin:0 0 6px}
.owedtext{min-width:0;margin-right:12px;font-size:17px}
.owedtext b{font-weight:700}
@media (prefers-reduced-motion:reduce){.fill,.xpfill,.duelbar span{transition:none}.celecard{animation:none}}
</style>

        ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        ctx.restore(); next.push(p);
      }
    }
    parts = next;
    if (parts.length) requestAnimationFrame(fxLoop);
    else { fxRunning = false; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); }
  }

    }
    sheet.appendChild(closeRow());
    showModal(sheet);
  }

  /* stakes: what the loser owes at the end of the week, month and year */
  function stakeRows(){
    var wrap = h("div", "stakes");
    DUEL_FREQS.forEach(function(fr){
      var s = standing(fr), row = h("div", "stakerow"), top = h("div", "sk-top");
      top.appendChild(h("span", "sk-label", fr === "weekly" ? "Week" : (fr === "monthly" ? "Month" : "Year")));
      var lead = h("span", "sk-lead", !(s.a + s.b) ? "No points yet" : (s.leader ? s.leader.name + " leads by " + num(s.gap) : "Dead heat"));
      if (s.leader) lead.style.color = s.leader.color;
      top.appendChild(lead); row.appendChild(top);
      row.appendChild(h("div", "sk-prize", state.stakes[fr]));
      wrap.appendChild(row);
    });
    return wrap;
  }

  function renderOwed(){
    var o = els.owed; o.innerHTML = "";
    var list = state.owed.filter(function(x){ return !x.paid; });
    o.hidden = !list.length;
    list.forEach(function(x){
      var w = personById(x.winner), l = personById(x.loser), row = h("div", "owedrow");
      row.style.borderLeftColor = w.color;
      var tx = h("div", "owedtext"), line = h("div");
      line.appendChild(h("b", null, l.name + " owes " + w.name + ":")); line.appendChild(document.createTextNode(" " + x.prize));
      tx.appendChild(line);
      tx.appendChild(h("div", "logwhen", periodLabel(x.freq, x.key) + " · won " + num(x.a) + " to " + num(x.b) + " XP"));
      var btn = h("button", "btn small", "Paid up"); btn.type = "button";
      btn.onclick = function(){ x.paid = true; save(); render(); sfx("reward"); };
      row.appendChild(tx); row.appendChild(btn); o.appendChild(row);
    });
  }

  function openStakes(){
    var sheet = newSheet(true);
    sheet.appendChild(h("div", "eyebrow", "Loser pays the winner"));
    sheet.appendChild(h("h3", "sheettitle", "Stakes"));
    sheet.appendChild(h("p", "empty", "Whoever has more XP when the week, month or year ends wins it. The other person then owes the prize until they tap Paid up. Type your own prize, or tap Shuffle idea."));
    DUEL_FREQS.forEach(function(fr){
      var s = standing(fr), f = freqById(fr);
      sheet.appendChild(h("div", "sect", f.label + " prize · decided " + ENDS[fr]));
      var row = h("div", "editrow");
      var inp = document.createElement("input");
      inp.type = "text"; inp.className = "field"; inp.value = state.stakes[fr]; inp.maxLength = 100;
      inp.setAttribute("aria-label", f.label + " prize");
      inp.onchange = function(){ var v = trim(inp.value); if (!v){ inp.value = state.stakes[fr]; return; } state.stakes[fr] = v; save(); render(); };
      var sh = h("button", "btn ghost small", "Shuffle idea"); sh.type = "button";
      sh.onclick = function(){
        var i = IDEAS[fr].indexOf(state.stakes[fr]);
        state.stakes[fr] = IDEAS[fr][(i + 1) % IDEAS[fr].length];
        save(); render(); openStakes();
      };
      row.appendChild(inp); row.appendChild(sh); sheet.appendChild(row);
      var ln = !(s.a + s.b) ? "No points yet this period" : (s.leader ? s.leader.name + " is ahead by " + num(s.gap) + " XP (" + num(Math.max(s.a, s.b)) + " to " + num(Math.min(s.a, s.b)) + ")" : "Dead heat at " + num(s.a) + " XP each");
      sheet.appendChild(h("div", "logwhen", ln));
    });
    sheet.appendChild(closeRow());
    showModal(sheet);
  }

  /* clock and rollover */
  function tick(){
    updateClock();
    if (ymd(new Date()) !== lastKey && els.modal.hidden && !editMode) render();
  }

  /* start */
  ["date","clock","arena","owed","board","modal","cele","fx","banner","edithint","btnEdit","btnLog","btnShop","btnStakes","btnTrophy","btnSound"].forEach(function(id){
    els[id] = document.getElementById(id);
  });

  state = load();
  save();

  els.btnEdit.onclick = function(){ editMode = !editMode; render(); };
  els.btnLog.onclick = openLog;
  els.btnShop.onclick = openShop;
  els.btnStakes.onclick = openStakes;
  els.btnTrophy.onclick = openTrophies;
  els.btnSound.onclick = function(){ state.sound = !state.sound; save(); render(); if (state.sound) sfx("tick"); };
  document.addEventListener("keydown", function(e){ if (e.keyCode === 27 && !els.modal.hidden) closeModal(); });
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) tick(); });

  updateClock();
  render();
  setInterval(tick, 15000);
})();
</script>

</body></html>
